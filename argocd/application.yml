apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfa-ticket-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/MmError404/PFA_DevOps_Cloud_Native.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false