services:
  web:
    build: ./app
    container_name: pfa-ticket-app
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: pfa-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped