name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Scan du code avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction de l’image Docker
        run: docker build -t hajarbenzakour/pfa-ticket-app:latest ./app

      - name: Scan de l’image Docker avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hajarbenzakour/pfa-ticket-app:latest
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Publication de l’image sur Docker Hub
        run: docker push hajarbenzakour/pfa-ticket-app:latest