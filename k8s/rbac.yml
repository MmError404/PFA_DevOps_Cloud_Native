apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-dashboard-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudops-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-dashboard-reader-binding
subjects:
  - kind: ServiceAccount
    name: cloudops-dashboard-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cloudops-dashboard-reader
  apiGroup: rbac.authorization.k8s.io