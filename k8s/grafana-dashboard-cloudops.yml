apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudops-dashboard.json: |
    {
      "uid": "cloudops-pfa-dashboard",
      "title": "CloudOps Platform Monitoring",
      "tags": ["cloudops", "devops", "pfa", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requêtes HTTP par endpoint",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(pfa_http_requests_total) by (exported_endpoint)",
              "legendFormat": "{{exported_endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Taux de requêtes HTTP",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(pfa_http_requests_total[5m])) by (exported_endpoint)",
              "legendFormat": "{{exported_endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Disponibilité de l'application",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "avg(up{job=\"pfa-ticket-app-service\"})",
              "legendFormat": "UP",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "bargauge",
          "title": "Pods Kubernetes par namespace",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(cloudops_kubernetes_pods_total) by (namespace, status)",
              "legendFormat": "{{namespace}} - {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Services Kubernetes par namespace",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "cloudops_kubernetes_services_total",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        }
      ]
    }